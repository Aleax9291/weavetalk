name: Bug 报告
description: 报告可复现的缺陷；安全问题请使用私密漏洞报告
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿在公开 Issue 中粘贴 API 密钥或真实客户数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 / commit SHA
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本、模型供应商；不要填写密钥
